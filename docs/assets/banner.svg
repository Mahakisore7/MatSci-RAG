<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#083344"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="20" fill="url(#grid)"/>
  <rect width="1280" height="320" rx="20" fill="url(#glow)"/>

  <!-- Perovskite (ABO3) unit cell: A-site corners, B-site centre, O at face centres -->
  <g transform="translate(1010 160)" stroke="#a5b4fc" stroke-opacity="0.55" stroke-width="1.5" fill="none">
    <path d="M-95 -45 L5 -45 L5 55 L-95 55 Z"/>
    <path d="M-55 -85 L45 -85 L45 15 L-55 15 Z" stroke-dasharray="4 5"/>
    <path d="M-95 -45 L-55 -85 M5 -45 L45 -85 M5 55 L45 15 M-95 55 L-55 15"/>
    <path d="M-25 -15 L-45 5 M-25 -15 L-5 -35 M-25 -15 L-25 -65 M-25 -15 L-25 35 M-25 -15 L-75 -15 M-25 -15 L25 -15" stroke="#22d3ee" stroke-opacity="0.45"/>
  </g>
  <g transform="translate(1010 160)">
    <g fill="#818cf8">
      <circle cx="-95" cy="-45" r="9"/><circle cx="5" cy="-45" r="9"/>
      <circle cx="5" cy="55" r="9"/><circle cx="-95" cy="55" r="9"/>
      <circle cx="-55" cy="-85" r="7" fill-opacity="0.6"/><circle cx="45" cy="-85" r="7" fill-opacity="0.6"/>
      <circle cx="45" cy="15" r="7" fill-opacity="0.6"/><circle cx="-55" cy="15" r="7" fill-opacity="0.6"/>
    </g>
    <circle cx="-25" cy="-15" r="12" fill="#22d3ee"/>
    <g fill="#f472b6">
      <circle cx="-45" cy="5" r="5"/><circle cx="-5" cy="-35" r="5"/>
      <circle cx="-25" cy="-65" r="5"/><circle cx="-25" cy="35" r="5"/>
      <circle cx="-75" cy="-15" r="5"/><circle cx="25" cy="-15" r="5"/>
    </g>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#cbd5e1" fill-opacity="0.75">
    <circle cx="1105" cy="236" r="5" fill="#818cf8"/><text x="1116" y="240">A-site</text>
    <circle cx="1105" cy="256" r="5" fill="#22d3ee"/><text x="1116" y="260">B-site</text>
    <circle cx="1105" cy="276" r="5" fill="#f472b6"/><text x="1116" y="280">O</text>
  </g>

  <g font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
    <text x="72" y="92" font-size="15" font-weight="600" letter-spacing="3" fill="#22d3ee">DOMAIN-SPECIFIC RETRIEVAL-AUGMENTED GENERATION</text>
    <text x="70" y="168" font-size="68" font-weight="800" fill="#f8fafc" letter-spacing="-1.5">MatSci-RAG</text>
    <rect x="72" y="188" width="132" height="4" rx="2" fill="url(#accent)"/>
    <text x="72" y="230" font-size="21" fill="#cbd5e1">NER-aware question answering over Solid Oxide Fuel Cell literature</text>
    <text x="72" y="266" font-size="15" fill="#94a3b8">MatSciBERT entities  ·  Hybrid dense + BM25 retrieval  ·  Grounded, self-verified answers</text>
  </g>
</svg>
