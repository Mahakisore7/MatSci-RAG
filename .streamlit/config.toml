[browser]
gatherUsageStats = false

[server]
fileWatcherType = "none"
headless = true
enableXsrfProtection = false
enableCORS = false

[client]
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#4f46e5"
backgroundColor = "#f8fafc"
secondaryBackgroundColor = "#f1f5f9"
textColor = "#0f172a"
linkColor = "#4f46e5"
borderColor = "#e2e8f0"
showWidgetBorder = true
baseRadius = "0.65rem"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap"

[theme.sidebar]
backgroundColor = "#0f172a"
secondaryBackgroundColor = "#1e293b"
textColor = "#e2e8f0"
borderColor = "#1e293b"
primaryColor = "#818cf8"
