[project]
name = "matsci-rag"
version = "1.0.0"
description = "Domain-specific RAG system for Solid Oxide Fuel Cell materials science literature, using MatSciBERT NER and hybrid dense+BM25 retrieval."
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
    "accelerate",
    "arxiv",
    "chromadb>=1.5.9",
    "datasets",
    "langchain>=1.3.14",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-huggingface>=1.2.2",
    "plotly>=7.0.0",
    "python-dotenv",
    "rank-bm25>=0.2.2",
    "scikit-learn",
    "sentence-transformers",
    "seqeval",
    "streamlit",
    "torch",
    "transformers",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cuda" },
]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
