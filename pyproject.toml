[project]
name = "matsci-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
    "accelerate",
    "arxiv",
    "datasets",
    "faiss-cpu",
    "matplotlib",
    "pandas",
    "python-dotenv",
    "scikit-learn",
    "sentence-transformers",
    "seqeval",
    "streamlit",
    "torch",
    "transformers",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cuda" },
]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
